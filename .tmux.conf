unbind r 
bind r source-file ~/.tmux.conf

set -g prefix C-a

set -g mouse on

set -g extended-keys on

# Start numering from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Pane splits should open to the same path as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Navigation change
bind-key h select-pane -L 
bind-key j select-pane -D 
bind-key k select-pane -U 
bind-key l select-pane -R 

# Remove confirmation for closing panes ajd windows
bind-key x kill-pane
bind-key & kill-window


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugins configuration
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Theme
bg_bar="#1C1928"        
fg_bar="#CFC9DE"       
fg_muted="#8C86A0"      
accent="#785EBF"        
accent_bright="#A98CE8"
accent_soft="#C6B7EC" 
border="#3A3350"     

set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${fg_bar},bg=${bg_bar}"
set -g status-left "#[fg=${accent_bright},bold]󱗿 #S #[fg=${fg_muted},nobold] | "
set -g window-status-current-format "#[fg=${accent_bright},bold]  #[underscore]#I: #W"
set -g window-status-format "#[fg=${fg_muted}] #I: #W"
set -g status-justify absolute-centre
set -g status-right ""
set -g message-style "fg=${bg_bar},bg=${accent_bright}"
set -g mode-style "fg=${bg_bar},bg=${accent_soft}"
set -g pane-border-style "fg=${border}"
set -g pane-active-border-style "fg=${accent_bright}"


# Initialize TMUX plugin manager 
run '~/.tmux/plugins/tpm/tpm'


